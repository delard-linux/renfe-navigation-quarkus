# Test configuration for integration tests
# Note: @QuarkusIntegrationTest runs with "prod" profile by default
# This file is loaded from src/it/resources for integration tests
quarkus.log.level=INFO
quarkus.log.category."com.delard.renfe".level=DEBUG

# Playwright integration-test overrides (equivalent to PlaywrightDebugNoHeadlessProfile)
playwright.headless=false
playwright.slow-mo=4000
playwright.timeout-navigation-ms=60000
playwright.timeout-networkidle-ms=60000
playwright.timeout-short-ms=1000



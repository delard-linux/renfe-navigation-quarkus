# Integration Test Configuration for PlaywrightSearchTrainsServiceIT
# This file is loaded when running integration tests with @QuarkusTest and @TestProfile(PlaywrightIntegrationTestProfile.class)
# Located at: src/test/resources/application-integration.properties
#
# This configuration is specifically for PlaywrightSearchTrainsServiceIT and other
# integration tests that use @QuarkusTest annotation with the integration test profile.

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.delard.renfe".level=DEBUG

# ============================================================================
# Playwright Configuration for Integration Tests
# ============================================================================
# These settings control how Playwright behaves during integration tests.
# Modify these values to debug tests or adjust execution speed.

# ----------------------------------------------------------------------------
# Headless Mode
# ----------------------------------------------------------------------------
# Controls whether the browser runs in headless mode (no visible window).
# 
# Set to 'false' to see the browser window during test execution (useful for debugging).
# Set to 'true' to run tests without a visible browser window (faster, CI/CD friendly).
#
# DEBUG TIP: Set to 'false' when debugging to visually see what the browser is doing.
#            This helps identify issues with page interactions, selectors, or timing.
playwright.headless=false

# ----------------------------------------------------------------------------
# Slow Motion (Delay Between Actions)
# ----------------------------------------------------------------------------
# Adds a delay (in milliseconds) between each Playwright action.
# This slows down the test execution to make it easier to observe what's happening.
#
# - 0: No delay (fastest execution, production-like)
# - 1000-2000: Small delay (good for normal debugging)
# - 3000-5000: Medium delay (easier to follow test execution)
# - 5000+: Large delay (very slow, use only when needed for detailed observation)
#
# DEBUG TIP: Increase this value (e.g., 4000-5000) when debugging to see each step
#            clearly. Decrease to 0 or 1000 for faster test runs once debugging is done.
playwright.slow-mo=4000

# ----------------------------------------------------------------------------
# Timeout Configuration
# ----------------------------------------------------------------------------
# These timeouts control how long Playwright waits for various operations.

# Navigation Timeout: Maximum time to wait for page navigation to complete
# Increase this if pages are slow to load during tests.
# DEBUG TIP: Increase to 60000+ if you're debugging and pages load slowly.
playwright.timeout-navigation-ms=60000

# Network Idle Timeout: Maximum time to wait for network activity to stop
# Increase this if pages have continuous background requests (polling, analytics, etc.).
# DEBUG TIP: Increase to 60000+ if you see timeout errors related to network activity.
playwright.timeout-networkidle-ms=60000

# General Timeout: Maximum time to wait for general operations (selectors, etc.)
# This is the default timeout for most Playwright operations.
playwright.timeout-ms=30000

# Short Timeout: Used for quick operations that should complete immediately
# Keep this low (500-1000ms) for fast feedback on quick operations.
playwright.timeout-short-ms=1000

# ----------------------------------------------------------------------------
# Viewport Configuration
# ----------------------------------------------------------------------------
# Browser window size. Adjust if you need to test different screen sizes.
playwright.viewport-width=1920
playwright.viewport-height=1080

# ----------------------------------------------------------------------------
# Locale Configuration
# ----------------------------------------------------------------------------
# Browser locale. Set to match the target application's language.
playwright.locale=es-ES

# ============================================================================
# Quick Debug Configuration Guide
# ============================================================================
# To enable full debugging mode (visible browser, slow execution):
#   1. Set playwright.headless=false
#   2. Set playwright.slow-mo=5000
#   3. Increase timeouts if needed (60000+)
#
# To run tests faster (for CI/CD or when debugging is done):
#   1. Set playwright.headless=true
#   2. Set playwright.slow-mo=0
#   3. Use default timeouts (30000)
#
# ============================================================================


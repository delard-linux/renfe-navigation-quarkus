# Configuration file
quarkus.application.name=renfe-navigation-api

# HTTP Configuration
quarkus.http.port=8000
quarkus.http.host=0.0.0.0

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} - %p - [%c{2}] - %m%n
quarkus.log.console.json=false

# Application logging
quarkus.log.category."com.renfe".level=INFO

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Renfe Navigation API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for searching train schedules and fares

# CORS Configuration (if needed)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Playwright Configuration
playwright.headless=false
playwright.viewport-width=1920
playwright.viewport-height=1080
playwright.slow-mo=2000
playwright.locale=es-ES
playwright.timeout-ms=30000
playwright.timeout-navigation-ms=30000
playwright.timeout-networkidle-ms=30000
playwright.timeout-short-ms=500

# Renfe Scraper Configuration
renfe.search-url=https://venta.renfe.com/vol/buscarTren.do?Idioma=es&Pais=ES
renfe.responses-dir=target/responses

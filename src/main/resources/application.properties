# Configuration file
quarkus.application.name=renfe-navigation-api

# HTTP Configuration
quarkus.http.port=8999
quarkus.http.host=0.0.0.0

# Logging Configuration
quarkus.log.level=INFO
# Console logging is enabled by default in Quarkus
# JSON logging format is controlled by quarkus-logging-json extension
# To disable JSON logging and use plain text, exclude quarkus-logging-json from dependencies

# Application logging
quarkus.log.category."com.delard.renfe".level=INFO

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Renfe Navigation API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for searching train schedules and fares

# CORS Configuration (if needed)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Playwright Configuration
playwright.headless=true
playwright.viewport-width=1920
playwright.viewport-height=1080
playwright.slow-mo=0
playwright.locale=es-ES
playwright.timeout-ms=30000
playwright.timeout-navigation-ms=30000
playwright.timeout-networkidle-ms=30000
playwright.timeout-short-ms=500

# Renfe Scraper Configuration
renfe.search-url=https://venta.renfe.com/vol/buscarTren.do?Idioma=es&Pais=ES
renfe.responses-dir=target/responses

# Renfe Stations Configuration
renfe.stations-url=https://www.renfe.com/content/dam/renfe/es/General/buscadores/javascript/estacionesEstaticas.js
renfe.stations-default=/data/estacionesEstaticas.js
renfe.stations-timeout=3

# Stations Cache Configuration
# Enable/disable cache for stations
renfe.stations-cache-enabled=true
# Cache TTL in seconds (default: 1 hour = 3600 seconds)
# Set to 0 or negative for no expiration
renfe.stations-cache-ttl-seconds=3600
# Cache type: "local" (default) or "redis" (future implementation)
# Valid values: "local", "redis"
# - "local": Uses LocalCacheAdapter (in-memory cache with ConcurrentHashMap)
# - "redis": Future implementation using RedisCacheAdapter (not yet implemented)
renfe.stations-cache-type=local

# MCP Server Configuration
# Enable MCP traffic logging for debugging
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=1000
# Note: MCP server SSE path is configured via extension, not via properties
